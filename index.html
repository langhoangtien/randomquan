<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bảng quay quân</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .app {
        max-width: 1120px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }

      .main-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .title {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .select,
      .button,
      .slot-pick-select {
        border-radius: 10px;
        font-size: 14px;
      }

      .select {
        height: 42px;
        min-width: 110px;
        border: 1px solid #d1d5db;
        padding: 0 12px;
        background: #fff;
      }

      .button {
        height: 42px;
        border: none;
        padding: 0 18px;
        background: #f59e0b;
        color: #111827;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(245, 158, 11, 0.25);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.95fr;
        gap: 18px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 14px;
      }

      .result-wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .team-box {
        min-height: 90px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
        padding: 12px;
        font-weight: 700;
      }

      .team-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .team-title-wrap {
        min-width: 0;
      }

      .team-name {
        font-size: 17px;
        word-break: break-word;
      }

      .team-index {
        min-width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
        border: 1px solid rgba(0, 0, 0, 0.15);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .team-bottom {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .slot-pick-select {
        width: 100%;
        height: 28px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        padding: 0 8px;
        background: rgba(255, 255, 255, 0.92);
        font-size: 12px;
        border-radius: 8px;
      }

      .history-title {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .history-pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }

      .page-btn {
        min-width: 80px;
        height: 36px;
        border: 1px solid #d1d5db;
        background: #fff;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }

      .page-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .page-info {
        font-size: 14px;
        color: #374151;
        font-weight: 600;
      }

      .history-item {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 12px;
        background: #fafafa;
      }

      .history-item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .history-time {
        font-size: 13px;
        color: #6b7280;
        text-align: right;
      }

      .history-teams {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .badge-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }

      .type-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 16px;
        padding: 0 5px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 800;
        line-height: 1;
        border: 1px solid #f59e0b;
        background: #fef3c7;
        color: #92400e;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        z-index: 2;
      }

      .empty {
        color: #6b7280;
        font-size: 14px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .result-wrap {
          grid-template-columns: 1fr;
        }

        .team-box {
          min-height: 84px;
        }

        .team-name {
          font-size: 15px;
        }

        .title {
          font-size: 16px;
        }

        .history-item-top {
          flex-direction: column;
          align-items: flex-start;
        }

        .history-time {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div id="mydiv"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function Hello() {
        const listquan = [
          "Egyptian",
          "Greek",
          "Babylonian",
          "Assyrian",
          "Minoan",
          "Hittite",
          "Phoenician",
          "Sumerian",
          "Persian",
          "Shang",
          "Yamato",
          "Choson",
          "Roman",
          "Carthaginian",
          "Palmyran",
          "Macedonia",
        ];

        const colors = [
          "blue",
          "red",
          "yellow",
          "#870000",
          "orange",
          "#04c304",
          "#cfcfcf",
          "#008eab",
        ];

        const darkTextIndexes = [2, 4, 6];

        const [number, setNumber] = useState(8);
        const [numberPress, setNumberPress] = useState(0);
        const [timePrew, setTimeprew] = useState("");
        const [history, setHistory] = useState([]);
        const [listRandom, setListRandom] = useState([]);
        const [currentPage, setCurrentPage] = useState(1);
        const [slotPicks, setSlotPicks] = useState(Array(8).fill("RANDOM"));

        useEffect(() => {
          const numberPressLocal = Number(localStorage.getItem("numnerPress") || 0);
          const timeLocal = localStorage.getItem("timeLocal") || "";
          const historyLocalJson = localStorage.getItem("historyLocal");
          const slotPicksJson = localStorage.getItem("slotPicks");

          setNumberPress(numberPressLocal);
          setTimeprew(timeLocal);

          if (historyLocalJson) {
            try {
              const parsed = JSON.parse(historyLocalJson);
              if (Array.isArray(parsed)) {
                setHistory(parsed);
              }
            } catch (error) {
              console.error("Parse history error:", error);
            }
          }

          if (slotPicksJson) {
            try {
              const parsed = JSON.parse(slotPicksJson);
              if (Array.isArray(parsed)) {
                const normalized = Array(8)
                  .fill("RANDOM")
                  .map((_, i) => parsed[i] || "RANDOM");
                setSlotPicks(normalized);
              }
            } catch (error) {
              console.error("Parse slotPicks error:", error);
            }
          }
        }, []);

        const syncSlotPickLength = (nextNumber) => {
          setSlotPicks((prev) => {
            const next = Array(nextNumber)
              .fill("RANDOM")
              .map((_, i) => prev[i] || "RANDOM");
            localStorage.setItem("slotPicks", JSON.stringify(next));
            return next;
          });
        };

        const selectNumber = (e) => {
          const nextNumber = Number(e.target.value);
          setNumber(nextNumber);
          syncSlotPickLength(nextNumber);
        };

        const updateSlotPick = (index, value) => {
          setSlotPicks((prev) => {
            const next = [...prev];
            next[index] = value;
            localStorage.setItem("slotPicks", JSON.stringify(next));
            return next;
          });

          setListRandom((prev) => {
            if (!prev.length) return prev;
            const next = [...prev];
            const isPick = value !== "RANDOM";
            next[index] = {
              name: isPick ? value : next[index]?.name || "",
              type: isPick ? "PICK" : "RANDOM",
            };
            return next;
          });
        };

        const setLocal = (resultData, resultTypes) => {
          const now = new Date().toLocaleString("vi-VN");
          const numberPressLocal = Number(localStorage.getItem("numnerPress") || 0);

          setNumberPress(numberPressLocal + 1);
          setTimeprew(now);

          localStorage.setItem("numnerPress", String(numberPressLocal + 1));
          localStorage.setItem("timeLocal", now);

          const nowRandom = {
            time: now,
            data: resultData,
            types: resultTypes,
          };

          const nowHistory = history.concat(nowRandom);
          const historyData =
            nowHistory.length > 100
              ? nowHistory.slice(nowHistory.length - 100)
              : nowHistory;

          localStorage.setItem("historyLocal", JSON.stringify(historyData));
          setHistory(historyData);
          setCurrentPage(1);
        };

        const getRecentPenaltyMap = () => {
          const penalty = {};
          const recentRounds = history.slice(-3);

          recentRounds.forEach((round, roundIndex) => {
            const decay = 3 - roundIndex;
            (round.data || []).forEach((name, idx) => {
              const type = Array.isArray(round.types) ? round.types[idx] : "RANDOM";
              if (type === "RANDOM") {
                penalty[name] = (penalty[name] || 0) + decay;
              }
            });
          });

          return penalty;
        };

        const weightedPick = (items, recentPenalty, currentResult) => {
          const weights = items.map((name) => {
            let weight = 100;

            const duplicateCountInCurrent = currentResult.filter((x) => x === name).length;
            if (duplicateCountInCurrent > 0) {
              weight -= 20 * duplicateCountInCurrent;
            }

            weight -= (recentPenalty[name] || 0) * 4;

            if (weight < 40) weight = 40;
            return weight;
          });

          const total = weights.reduce((sum, w) => sum + w, 0);
          let rand = Math.random() * total;

          for (let i = 0; i < items.length; i++) {
            rand -= weights[i];
            if (rand <= 0) return items[i];
          }

          return items[items.length - 1];
        };

        const randomQuanSoftDuplicate = () => {
          const recentPenalty = getRecentPenaltyMap();
          const resultNames = [];
          const resultTypes = [];

          for (let i = 0; i < number; i++) {
            const slotValue = slotPicks[i] || "RANDOM";

            if (slotValue !== "RANDOM") {
              resultNames.push(slotValue);
              resultTypes.push("PICK");
            } else {
              const randomValue = weightedPick(listquan, recentPenalty, resultNames);
              resultNames.push(randomValue);
              resultTypes.push("RANDOM");
            }
          }

          setListRandom(
            resultNames.map((name, idx) => ({
              name,
              type: resultTypes[idx],
            }))
          );

          setLocal(resultNames, resultTypes);
        };

        const splitColumns = (list) => {
          const leftCount = Math.ceil(list.length / 2);
          return {
            left: list.slice(0, leftCount),
            right: list.slice(leftCount),
          };
        };

        const renderTeamBox = (item, index) => {
          const color = colors[index % colors.length];
          const textColor = darkTextIndexes.includes(index % colors.length)
            ? "#111827"
            : "#ffffff";
          const slotValue = slotPicks[index] || "RANDOM";

          return (
            <div
              key={`${index}-${item?.name || "empty"}`}
              className="team-box"
              style={{ background: color, color: textColor }}
            >
              <div className="team-top">
                <div className="team-title-wrap">
                  <div className="team-name">{item?.name || "-"}</div>
                </div>
                <div className="team-index">{index + 1}</div>
              </div>

              <div className="team-bottom">
                <select
                  className="slot-pick-select"
                  value={slotValue}
                  onChange={(e) => updateSlotPick(index, e.target.value)}
                >
                  <option value="RANDOM">Random</option>
                  {listquan.map((team) => (
                    <option key={`${index}-${team}`} value={team}>
                      {team}
                    </option>
                  ))}
                </select>
              </div>
            </div>
          );
        };

        const renderBadge = (teamName, index, key, type = "RANDOM") => {
          const color = colors[index % colors.length];
          const textColor = darkTextIndexes.includes(index % colors.length)
            ? "#111827"
            : "#ffffff";

          return (
            <div key={key} className="badge-wrap">
              <span
                className="badge"
                style={{ background: color, color: textColor }}
              >
                {teamName}
              </span>
              {type === "PICK" && <span className="type-badge">PICK</span>}
            </div>
          );
        };

        const pageSize = 10;
        const reversedHistory = history.slice().reverse();
        const totalPages = Math.max(1, Math.ceil(reversedHistory.length / pageSize));
        const startIndex = (currentPage - 1) * pageSize;
        const paginatedHistory = reversedHistory.slice(
          startIndex,
          startIndex + pageSize
        );

        const goPrevPage = () => {
          setCurrentPage((prev) => Math.max(1, prev - 1));
        };

        const goNextPage = () => {
          setCurrentPage((prev) => Math.min(totalPages, prev + 1));
        };

        const visibleCurrentList =
          listRandom.length > 0
            ? listRandom
            : Array(number)
                .fill(null)
                .map((_, i) => ({
                  name: slotPicks[i] !== "RANDOM" ? slotPicks[i] : "-",
                  type: slotPicks[i] !== "RANDOM" ? "PICK" : "",
                }));

        const currentSplit = splitColumns(visibleCurrentList);

        return (
          <div className="app">
            <div className="main-card">
              <div className="topbar">
                <div className="title">
                  Xin chào bạn. Đây là map thứ <b>{numberPress}</b>
                  {timePrew ? ` · Lần gần nhất: ${timePrew}` : ""}
                </div>

                <div className="controls">
                  <select
                    value={number}
                    onChange={selectNumber}
                    className="select"
                  >
                    <option value={2}>2 quân</option>
                    <option value={3}>3 quân</option>
                    <option value={4}>4 quân</option>
                    <option value={5}>5 quân</option>
                    <option value={6}>6 quân</option>
                    <option value={7}>7 quân</option>
                    <option value={8}>8 quân</option>
                  </select>

                  <button className="button" onClick={randomQuanSoftDuplicate}>
                    Random quân
                  </button>
                </div>
              </div>

              <div className="layout">
                <div className="panel">
                  <div className="result-wrap">
                    <div className="column">
                      {currentSplit.left.map((item, idx) => renderTeamBox(item, idx))}
                    </div>

                    <div className="column">
                      {currentSplit.right.map((item, idx) =>
                        renderTeamBox(item, currentSplit.left.length + idx)
                      )}
                    </div>
                  </div>
                </div>

                <div className="panel">
                  <h3 className="history-title">Lịch sử</h3>

                  <div className="history-list">
                    {history.length === 0 ? (
                      <div className="empty">Chưa có lịch sử.</div>
                    ) : (
                      <>
                        <div className="history-pagination">
                          <button
                            className="page-btn"
                            onClick={goPrevPage}
                            disabled={currentPage === 1}
                          >
                            Trước
                          </button>

                          <div className="page-info">
                            Trang {currentPage} / {totalPages}
                          </div>

                          <button
                            className="page-btn"
                            onClick={goNextPage}
                            disabled={currentPage === totalPages}
                          >
                            Sau
                          </button>
                        </div>

                        {paginatedHistory.map((item, i) => (
                          <div className="history-item" key={`${item.time}-${i}`}>
                            <div className="history-item-top">
                              <b>#{history.length - startIndex - i}</b>
                              <div className="history-time">{item.time}</div>
                            </div>

                            <div className="history-teams">
                              {(item.data || []).map((teamName, index) =>
                                renderBadge(
                                  teamName,
                                  index,
                                  `${item.time}-${index}`,
                                  Array.isArray(item.types) ? item.types[index] : "RANDOM"
                                )
                              )}
                            </div>
                          </div>
                        ))}
                      </>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const container = document.getElementById("mydiv");
      const root = ReactDOM.createRoot(container);
      root.render(<Hello />);
    </script>
  </body>
</html>
